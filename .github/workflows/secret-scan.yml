name: secret-scan

# gitleaks：扫描本次推送 / PR 新增的提交，拦住误提交的 token、密钥、私钥。
# 手动触发（workflow_dispatch）时扫描全部历史。已核实的误报写在 .gitleaksignore。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$GITHUB_SHA" ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
                 && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range="$BEFORE..$GITHUB_SHA"
              else
                range="origin/$DEFAULT_BRANCH..$GITHUB_SHA"   # 新分支 / force push
              fi ;;
            *) range="" ;;   # workflow_dispatch：全部历史
          esac
          echo "scan range: ${range:-<full history>}"
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1 ${range:+--log-opts="$range"}
