name: iac-scan

# trivy config：扫描 Terraform 配置里的 HIGH/CRITICAL 风险（放开的安全组、公开存储、未加密等）。
# 已知并接受的项写在 .trivyignore（逐条注明原因）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install trivy 0.76.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: trivy config
        run: |
          "$RUNNER_TEMP/trivy" config --severity HIGH,CRITICAL --exit-code 1 .
